<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            position: relative;
            height: 500px;
            border: 2px solid green;
        }

        .zero {
            border: 2px solid blue;
        }

        .first {
            position: absolute;
            border: 2px solid red;
            top: 5px;
            margin-left: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="zero">
            This is zero.
        </div>
        <div class="first">
            This is first.
        </div>
    </div>
</body>

</html>
